<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Match</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-image: url('https://i.ibb.co/23sD7RV9/59ed6a3931e4a00598314544935d0f8c.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Dark overlay over the background image to keep text readable */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Glassmorphism transparent box */
        .card {
            background: rgba(20, 20, 20, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            color: #ff477e;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 26px;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .question {
            font-size: 15px;
            color: #e0e0e0;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Distinct vibrant colors for each option with high contrast */
        .option-casual {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        .option-longterm {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .option-sure {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a1a; /* Dark text for bright yellow gradient */
            border-color: rgba(255, 255, 255, 0.4);
        }

        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            opacity: 0.95;
        }

        .footer-links {
            margin-top: 18px;
            font-size: 12px;
            color: #b0b0b0;
        }

        .footer-links a {
            color: #b0b0b0;
            text-decoration: underline;
            margin: 0 6px;
        }

        .footer-links a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="brand">Local Connect</div>
            <h1>Find Your Perfect Match</h1>
            <p class="question">What type of relationship are you looking for?</p>
            
            <div class="options-group">
                <a href="https://mypage.name.ng/" class="option-btn option-casual">Casual</a>
                <a href="https://mypage.name.ng/" class="option-btn option-longterm">Long-term</a>
                <a href="https://mypage.name.ng/" class="option-btn option-sure">Not sure yet</a>
            </div>

            <div class="footer-links">
                <a href="https://mypage.name.ng/">Terms of Service</a> | 
                <a href="https://mypage.name.ng/">Privacy Policy</a>
            </div>
        </div>
    </div>

</body>
